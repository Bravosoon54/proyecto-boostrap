<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokio, Japón - Agencia de Viajes</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg fondo_oscuro text-white">
    <div class="container-fluid">
      <a class="navbar-brand text-white" href="index.html"><img class="imagen_icono" src="img/icono_agencia.png"
          alt="">WanderQuest</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="destinos.html">Destinos</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="promociones.html">Promociones</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="vuelos.html">Vuelos</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <section class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Compra de Promoción</h2>
      <div class="row">
        <div class="col-md-8 offset-md-2">
          <div class="card">
            <div class="card-body">
              <h3 class="card-title">Formulario de Compra</h3>
              <form id="promocion-form">
                <div class="mb-3">
                  <label for="promocion" class="form-label">Selecciona una Promoción</label>
                  <select class="form-select" id="promocion" required>
                    <option value="" disabled selected>Selecciona una promoción</option>
                    <option value="europa">Paquetes a Europa</option>
                    <option value="asia">Vuelos a Asia</option>
                    <option value="america">Paquetes Todo Incluido a América del Sur</option>
                  </select>
                </div>

                <div id="europa-options" class="d-none">
                  <label class="form-label">Paquetes a Europa</label>
                  <select class="form-select">
                    <option value="paris">Paquete a París</option>
                    <option value="londres">Paquete a Londres</option>
                    <option value="roma">Paquete a Roma</option>
                  </select>
                </div>

                <div id="asia-options" class="d-none">
                  <label class="form-label">Vuelos a Asia</label>
                  <select class="form-select">
                    <option value="tokio">Vuelo a Tokio</option>
                    <option value="seul">Vuelo a Seúl</option>
                  </select>
                </div>

                <div id="america-options" class="d-none">
                  <label class="form-label">Paquetes Todo Incluido a América del Sur</label>
                  <select class="form-select">
                    <option value="brasil">Paquete a Brasil</option>
                    <option value="argentina">Paquete a Argentina</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre Completo</label>
                  <input type="text" class="form-control" id="nombre" required>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Correo Electrónico</label>
                  <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <input type="tel" class="form-control" id="telefono" required>
                </div>
                <div class="mb-3">
                  <label for="mensaje" class="form-label">Mensaje Adicional</label>
                  <textarea class="form-control" id="mensaje" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Enviar Solicitud de compra  </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="fondo_oscuro text-white py-3">
    <div class="container">
      <div class="row text-center text-md-start">
        <div class="col-md-4 d-flex align-items-center justify-content-center justify-content-md-start mb-3 mb-md-0">
          <img src="img/icono_agencia.png" alt="Logo" class="img-fluid imagen_icono_f">
        </div>
        <div class="col-md-4 d-flex align-items-center justify-content-center text-center mb-3 mb-md-0">
          <p class="mb-0">&copy; 2024 Agencia de Viajes. Todos los derechos reservados.</p>
        </div>
        <div class="col-md-4 d-flex align-items-center justify-content-center justify-content-md-end">
          <a href="#" class="text-light fs-2 me-2"><i class="fab fa-facebook"></i></a>
          <a href="#" class="text-light fs-2 me-2"><i class="fa-brands fa-square-x-twitter"></i></a>
          <a href="#" class="text-light fs-2 me-2"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('promocion').addEventListener('change', function () {
      const value = this.value;
      document.querySelectorAll('#europa-options, #asia-options, #america-options').forEach(function (el) {
        el.classList.add('d-none');
      });
      if (value === 'europa') {
        document.getElementById('europa-options').classList.remove('d-none');
      } else if (value === 'asia') {
        document.getElementById('asia-options').classList.remove('d-none');
      } else if (value === 'america') {
        document.getElementById('america-options').classList.remove('d-none');
      }
    });
  </script>
</body>

</html>
